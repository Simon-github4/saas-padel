spring:
  application:
    name: padel-saas

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/padel}
    username: ${DB_USER:padel}
    password: ${DB_PASSWORD:padel}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. Hibernate solo valida que coincida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Sin time_zone a proposito. Todos los instantes viven en timestamptz, que
          # ya es absoluto y no necesita ayuda. Forzar UTC aca ademas convierte las
          # columnas TIME, y esas son horas de reloj de pared: el club que abre a las
          # 18:00 terminaba guardado como 21:00, y su cierre 23:59 como 02:59, que
          # encima viola el CHECK de que el fin sea posterior al inicio.
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Sin esto, un SMTP caido o lento se cuelga sin limite - con hilos
      # virtuales eso acumula hilos bloqueados bajo carga real.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

vaadin:
  # El panel vive bajo /admin porque la raiz es del jugador: el link que el club
  # comparte por WhatsApp es la grilla publica, no el panel interno.
  url-mapping: /admin/*
  frontend:
    # Sin servidor de desarrollo: el panel no agrega frontend propio, asi que
    # Vaadin sirve su bundle prearmado. Evita depender de Node y de Vite en cada
    # arranque y en cada test. Si algun dia se agrega un tema o componentes
    # propios, hay que poner esto en true y sumar com.vaadin:vaadin-dev-server.
    hotdeploy: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  # Sin esto, un redeploy corta requests y webhooks a mitad de camino: deja de
  # aceptar conexiones nuevas pero espera a que terminen las que ya estaban en vuelo.
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  security:
    # openssl rand -base64 32
    encryption-key: ${APP_ENCRYPTION_KEY:}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:off}
    from-number: ${WHATSAPP_FROM:}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
  jobs:
    enabled: true
    recurring-horizon-weeks: 8
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  analytics:
    enabled: ${ANALYTICS_ENABLED:true}
    retention-months: 12
  mail:
    # Sin default a "log": esos emails llevan links de reset/verificacion, que
    # son credenciales de verdad. Sin MAIL_PROVIDER definido, la app no
    # arranca en vez de imprimirlos en el log de produccion.
    provider: ${MAIL_PROVIDER:}
    from: ${MAIL_FROM:no-responder@padelnec.com.ar}

logging:
  level:
    ar.com.padelnec: INFO

---
# Desarrollo local: Postgres embebido (no hace falta Docker ni instalar el motor).
# La clave de cifrado no vive aca: DevEncryptionKeyConfig la genera sola y la
# guarda en target/, para no tener una clave real (aunque sea "solo de dev")
# commiteada en el repo.
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  mail:
    provider: log

logging:
  level:
    ar.com.padelnec: DEBUG
    org.hibernate.SQL: DEBUG
