<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Tu cuenta del gimnasio: cuántos días te quedan y tu ingreso con el QR de la entrada." />
    <!-- Es una app privada del club: que ningun buscador la indexe. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS lee estas metas para abrirla a pantalla completa desde el inicio. El
         manifest de cada club lo agrega la app (ver useClub), porque su URL lleva
         el slug. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Mi gimnasio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
